# Diese Datei brauchst du nur, wenn du den Server vom Computer aus
# hochladen willst (mit "npx wrangler deploy"). Über die Cloudflare-
# Webseite geht es auch ohne - so steht es in ANLEITUNG.md.

name = "weltenkaempfer-zaehler"
main = "worker.js"
compatibility_date = "2026-01-01"

# Der Zähler
[[d1_databases]]
binding = "DB"
database_name = "weltenkaempfer"
database_id = "ecca166f-21e4-4299-a714-325dc901293f"

# Die gemeinsame Welt
[[durable_objects.bindings]]
name = "WELT"
class_name = "Welt"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Welt"]
